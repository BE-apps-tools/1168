name = "1168-panhandle"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Non-secret variables live here so they survive every (Git-connected) redeploy.
# (Previously set only in the dashboard, they were wiped on each `wrangler deploy`.)
[vars]
GH_REPO = "be-apps-tools/1168"
ALLOWED_ORIGIN = "https://be-apps-tools.github.io"

# Secrets are set in the Cloudflare dashboard (they persist across deploys):
#   GH_TOKEN    – fine-grained PAT, Issues read+write
#   SUBMIT_KEY  – public spam-deterrent for reassignment requests
#   ADMIN_KEY   – private gate for delivery-tracker writes
#   TEAMS_WEBHOOK_URL – OPTIONAL. Set it and every submitted change request also
#                 posts a card to that Teams channel (see SETUP.md §7). Leave it
#                 unset and nothing is sent. It is a secret: anyone holding the
#                 URL can post to the channel.
#
# PORTAL_URL – OPTIONAL, not a secret. Base URL the portal is served from, used for
# the Teams card's "Review in portal" button. Only needed when the portal is not at
# ALLOWED_ORIGIN + "/<repo>/" (custom domain, subpath); otherwise it is derived.
